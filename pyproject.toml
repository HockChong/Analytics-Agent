[project]
name = "finrag"
version = "0.1.0"
description = "Gated financial document pipeline: parse, evidence, retrieve, generate, verify, audit"
requires-python = ">=3.11"
dependencies = [
    "mineru==4.0.12",
    "pdfplumber>=0.11",
    "pydantic>=2.7",
    "pandas>=2.2",
    "pyarrow>=16",
    "pyyaml>=6",
    "beautifulsoup4>=4.12",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
